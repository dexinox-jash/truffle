[package]
name = "ruflo-realtime"
version = "1.0.0"
edition = "2021"
authors = ["Ruflo Team <team@ruflo.ai>"]
description = "WebSocket realtime service for Ruflo AI Meeting Platform"

[dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# WebSocket
axum = { version = "0.7", features = ["ws"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono"] }

# Message Queue
async-nats = "0.33"

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Authentication
jsonwebtoken = "9.2"

# Audio processing
symphonia = { version = "0.5", features = ["wav", "mp3", "flac"] }
byteorder = "1.5"

# Signaling
webrtc = "0.10"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
dashmap = "5.5"
parking_lot = "0.12"

# Metrics
metrics = "0.22"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "ruflo-realtime"
path = "src/main.rs"
