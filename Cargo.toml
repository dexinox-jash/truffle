[workspace]
members = [
    "truffle-crypto",
    "truffle-core",
    # "truffle-ai",  # Deferred — requires Metal/CUDA GPU SDK for llama.cpp
    "truffle-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Truffle AI Agents <agents@truffle.io>"]
license = "AGPL-3.0"
repository = "https://github.com/truffle-ai/truffle"
homepage = "https://truffle.io"
description = "Local-first, zero-knowledge screenshot knowledge graph"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"
rand = "0.8"
getrandom = "0.2"

# Post-quantum cryptography
pqc-kyber = { version = "0.7", optional = true }

# Database
rusqlite = { version = "0.30", features = ["bundled", "serde_json", "chrono", "uuid"] }

# Async traits
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1.7", features = ["v4", "v5", "serde", "rng"] }

# CRDT sync (Yjs Rust port)
yrs = "0.18"

# Testing
tokio-test = "0.4"
tempfile = "3.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
debug = true
