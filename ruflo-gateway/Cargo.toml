[package]
name = "ruflo-gateway"
version = "1.0.0"
edition = "2021"
authors = ["Ruflo Team <team@ruflo.ai>"]
description = "API Gateway for Ruflo AI Meeting Platform"

[dependencies]
# Core
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression", "timeout"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "json"] }

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"
bcrypt = "0.15"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
dotenv = "0.15"

# HTTP Client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
moka = { version = "0.12", features = ["future"] }

# Rate limiting
governor = "0.2"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
regex = "1.10"

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
http-body-util = "0.1"

[[bin]]
name = "ruflo-gateway"
path = "src/main.rs"
