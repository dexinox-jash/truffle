name: Vault Secrets Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_NAMESPACE: ${{ secrets.VAULT_NAMESPACE }}

jobs:
  fetch-secrets:
    name: Fetch Secrets from Vault
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for JWT auth
    
    outputs:
      database_url: ${{ steps.secrets.outputs.database_url }}
      redis_url: ${{ steps.secrets.outputs.redis_url }}
      jwt_secret: ${{ steps.secrets.outputs.jwt_secret }}
      api_keys: ${{ steps.secrets.outputs.api_keys }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Import Secrets from Vault
      id: secrets
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ secrets.VAULT_ADDR }}
        namespace: ${{ secrets.VAULT_NAMESPACE }}
        method: jwt
        role: github-actions
        jwtGithubAudience: https://github.com/${{ github.repository_owner }}
        jwtTtl: 3600
        secrets: |
          secret/data/ci/database url | database_url ;
          secret/data/ci/redis url | redis_url ;
          secret/data/ci/auth jwt_secret | jwt_secret ;
          secret/data/ci/ai/openai api_key | openai_api_key ;
          secret/data/ci/ai/anthropic api_key | anthropic_api_key ;

    - name: Validate Secrets
      run: |
        if [ -z "${{ steps.secrets.outputs.database_url }}" ]; then
          echo "Error: DATABASE_URL is empty"
          exit 1
        fi
        
        if [ -z "${{ steps.secrets.outputs.jwt_secret }}" ]; then
          echo "Error: JWT_SECRET is empty"
          exit 1
        fi
        
        echo "✓ All required secrets fetched successfully"

  test-with-secrets:
    name: Test with Vault Secrets
    needs: fetch-secrets
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: ${{ needs.fetch-secrets.outputs.database_url }}
      REDIS_URL: ${{ needs.fetch-secrets.outputs.redis_url }}
      JWT_SECRET: ${{ needs.fetch-secrets.outputs.jwt_secret }}
      OPENAI_API_KEY: ${{ needs.fetch-secrets.outputs.openai_api_key }}
      ANTHROPIC_API_KEY: ${{ needs.fetch-secrets.outputs.anthropic_api_key }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ruflo-command/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run migrations
      run: |
        cd ruflo-command
        cargo run --bin migrate -- migrate

    - name: Run tests
      run: |
        cd ruflo-command
        cargo test --lib --verbose

    - name: Run integration tests
      run: |
        cd ruflo-command
        cargo test --test integration_tests --verbose

  deploy-staging-secrets:
    name: Deploy Staging Secrets
    needs: [fetch-secrets, test-with-secrets]
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Update Kubernetes secrets
      run: |
        aws eks update-kubeconfig --name ruflo-staging-cluster --region us-east-1
        
        # Create or update secrets
        kubectl create secret generic ruflo-secrets \
          --from-literal=DATABASE_URL='${{ needs.fetch-secrets.outputs.database_url }}' \
          --from-literal=REDIS_URL='${{ needs.fetch-secrets.outputs.redis_url }}' \
          --from-literal=JWT_SECRET='${{ needs.fetch-secrets.outputs.jwt_secret }}' \
          --namespace ruflo-staging \
          --dry-run=client -o yaml | kubectl apply -f -
        
        # Restart deployments to pick up new secrets
        kubectl rollout restart deployment/ruflo-command -n ruflo-staging
        kubectl rollout restart deployment/ruflo-gateway -n ruflo-staging

  deploy-production-secrets:
    name: Deploy Production Secrets
    needs: [fetch-secrets, test-with-secrets]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Update Kubernetes secrets
      run: |
        aws eks update-kubeconfig --name ruflo-production-cluster --region us-east-1
        
        # Create or update secrets
        kubectl create secret generic ruflo-secrets \
          --from-literal=DATABASE_URL='${{ needs.fetch-secrets.outputs.database_url }}' \
          --from-literal=REDIS_URL='${{ needs.fetch-secrets.outputs.redis_url }}' \
          --from-literal=JWT_SECRET='${{ needs.fetch-secrets.outputs.jwt_secret }}' \
          --namespace ruflo-production \
          --dry-run=client -o yaml | kubectl apply -f -
        
        echo "Secrets updated in production. Manual rollout required."
        echo "Run: kubectl rollout restart deployment/ruflo-command -n ruflo-production"

  audit-secrets:
    name: Audit Secret Usage
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check for hardcoded secrets
      run: |
        # Install secret detection tool
        pip install detect-secrets
        
        # Scan for secrets
        detect-secrets scan --all-files --force-use-all-plugins > .secrets.baseline || true
        
        # Check if any secrets were found
        if grep -q '"type"' .secrets.baseline; then
          echo "⚠️  Potential secrets detected in codebase"
          detect-secrets audit .secrets.baseline
          exit 1
        fi
        
        echo "✓ No hardcoded secrets detected"

    - name: Verify Vault policy compliance
      run: |
        # Check that no secrets are in env files
        if find . -name ".env*" -type f | grep -q .; then
          echo "⚠️  .env files found in repository"
          echo "Please ensure these are in .gitignore and not committed"
          find . -name ".env*" -type f
        fi
        
        # Check for common secret patterns in source
        if grep -r "password.*=" --include="*.rs" ruflo-command/src/ | grep -v "// " | grep -v "password_field\|password_hash"; then
          echo "⚠️  Potential hardcoded passwords found"
          exit 1
        fi
        
        echo "✓ Vault policy compliance verified"
