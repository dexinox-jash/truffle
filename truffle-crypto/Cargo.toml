[package]
name = "truffle-crypto"
version = "0.1.0"
edition = "2021"
authors = ["Project Truffle Security Team"]
description = "Zero-knowledge cryptographic layer for Project Truffle"
license = "AGPL-3.0"
repository = "https://github.com/truffle/truffle-crypto"
rust-version = "1.70"

[dependencies]
# Symmetric Encryption
aes-gcm = { version = "0.10", features = ["std", "aes"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }

# Hashing & KDF
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
hmac = "0.12"

# Asymmetric Cryptography (Signal Protocol)
ed25519-dalek = { version = "2.0", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }

# Post-Quantum Cryptography (Kyber-768)
pqc_kyber = { version = "0.7", features = ["std"], optional = true }

# Randomness
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
getrandom = "0.2"

# QR Code Generation
qrcode = { version = "0.14", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"

# Error Handling
thiserror = "1.0"

# Zeroize for secure memory clearing
zeroize = { version = "1.7", features = ["derive", "zeroize_derive"] }

# Constant-time operations
subtle = "2.5"
constant_time_eq = "0.3"

# Blake2 hashing
blake2 = "0.10"

# Encoding
base32 = "0.5"

# Serde bytes support
serde_bytes = "0.11"

# Logging (security events only)
log = "0.4"

# Time handling
time = { version = "0.3", features = ["std", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
post-quantum = ["pqc_kyber"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

# Bench file will be created when benchmarks are implemented
# [[bench]]
# name = "crypto_bench"
# harness = false

# Profiles defined in workspace root Cargo.toml
