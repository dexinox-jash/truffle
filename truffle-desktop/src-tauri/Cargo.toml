[package]
name = "truffle-desktop"
version = "0.1.0"
description = "Project Truffle - Local-First Knowledge Compiler"
authors = ["Truffle Team"]
license = "AGPL-3.0"
repository = "https://github.com/truffle/truffle-desktop"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-os = "2.0.0"
tauri-plugin-process = "2.0.0"
tauri-plugin-updater = "2.0.0"

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.30", features = ["bundled", "chrono", "uuid", "serde_json"] }
refinery = { version = "0.8", features = ["rusqlite"] }

# Vector search
sqlite-vec = "0.1"

# Cryptography
ring = "0.17"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
rand = "0.8"
base64 = "0.21"
hex = "0.4"

# Image processing
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }

# HTTP/WebSocket
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# File system
walkdir = "2.4"
dirs = "5.0"
tempfile = "3.9"

# Async runtime utilities
futures = "0.3"
parking_lot = "0.12"
dashmap = "5.5"

# Platform-specific
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
dev = []

# Profiles defined in workspace root Cargo.toml
