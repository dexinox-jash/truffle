# HashiCorp Vault Helm values
server:
  enabled: true
  
  # HA mode with Raft storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
        seal "awskms" {
          region = "us-west-2"
          kms_key_id = "arn:aws:kms:us-west-2:ACCOUNT:key/KEY-ID"
        }

  # Resources
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Data persistence
  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: /vault/data
    storageClass: gp3

  # Audit logs
  auditStorage:
    enabled: true
    size: 10Gi
    mountPath: /vault/audit

  # Service account for AWS IAM auth
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/vault-server-role

# Vault Agent Injector
injector:
  enabled: true
  replicas: 2

# UI
ui:
  enabled: true
  serviceType: ClusterIP
