<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      min-height: 400px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
    }
    .header {
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .content {
      padding: 16px;
    }
    .meeting-detected {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .meeting-detected h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #94a3b8;
    }
    .meeting-detected p {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }
    .record-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .record-btn.start {
      background: #3b82f6;
      color: white;
    }
    .record-btn.stop {
      background: #ef4444;
      color: white;
    }
    .record-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
    }
    .status.recording {
      color: #ef4444;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .footer {
      padding: 16px;
      border-top: 1px solid #334155;
      text-align: center;
    }
    .footer a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎙️</div>
    <h1>Ruflo</h1>
  </div>
  
  <div class="content">
    <div class="meeting-detected" id="meetingInfo" style="display: none;">
      <h3>Meeting Detected</h3>
      <p id="meetingPlatform">Loading...</p>
    </div>

    <button class="record-btn start" id="recordBtn">
      <span>●</span>
      Start Recording
    </button>

    <div class="status" id="status">
      Ready to record
    </div>
  </div>

  <div class="footer">
    <a href="https://ruflo.io/dashboard" target="_blank">Open Dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
